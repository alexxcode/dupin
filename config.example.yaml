# Plantilla de configuración de Dupin.
# Copiar a config.yaml y ajustar. config.yaml está en .gitignore (Invariante 8).

gcp:
  project_id: dupin-dupin          # Proyecto fijado en Fase 0. Todo el desarrollo aquí.
  region: us-central1

buckets:
  raw: dupin-dupin-raw             # Transacciones crudas, inmutables.
  features: dupin-dupin-features   # Matriz de features versionada.
  artifacts: dupin-dupin-artifacts # Bundle: model + schema + threshold + metadata.

data:
  # PaySim — Lopez-Rojas, Elmir & Axelsson (2016). CC BY-SA 4.0. Vía Kaggle.
  kaggle_dataset: ealaxi/paysim1
  raw_object: raw/paysim/PS_20174392719_1491204439457_log.csv

versions:
  feature_version: feat-v1
  model_version: m-v1

# Split temporal tres-vías (Fase 3). step: 1 = 1 hora; 744 steps = 30 días.
# train [0, 432)  ≈ 18 días  |  val [432, 480)  ≈ 2 días  |  test [480, 744) ≈ 10 días.
# El test de cola es más denso en fraude (futuro distinto del pasado): honesto.
split:
  train_max_step: 432
  val_max_step: 480

# Punto de operación de cabecera: revisar como máximo este % de operaciones.
evaluation:
  review_budget: 0.01              # recall @ ≤1% de operaciones revisadas
  cost_fn_over_fp: 100             # curva de costo secundaria: FN cuesta 100× FP

seed: 42
